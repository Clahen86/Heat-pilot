name: Add-on image

on:
  push:
    tags: ["v*"]

jobs:
  addon:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64 }
          - { arch: aarch64, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          grep -qE "^version: \"?$V\"?$" heat_pilot/config.yaml || { echo "tag != config.yaml"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: heat_pilot
          platforms: ${{ matrix.platform }}
          push: true
          build-args: BUILD_VERSION=${{ steps.v.outputs.version }}
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.v.outputs.version }}
          tags: ghcr.io/clahen86/${{ matrix.arch }}-heat-pilot-addon:${{ steps.v.outputs.version }}
