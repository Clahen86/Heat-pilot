<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Varmepilot</title>
<style>
  :root {
    --bg:#06080d; --surface:#0d1118; --surface2:#131924; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
    --text:#f3f5f9; --muted:#8b93a3; --faint:#5b6372;
    --heat:#ff8a3d; --cool:#5ab8ff; --off:#6b7280; --ok:#3ddc97; --warn:#f5b544; --bad:#ff5d6c; --accent:#ff6b4a;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme=dark]) { --bg:#f4f6fa; --surface:#ffffff; --surface2:#f0f3f8; --line:rgba(15,23,42,.08); --line2:rgba(15,23,42,.14);
      --text:#0b1220; --muted:#5d6676; --faint:#9aa3b2; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.45 -apple-system, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 1; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
    background:radial-gradient(900px 420px at 50% -120px, color-mix(in srgb, var(--accent) 20%, transparent), transparent 70%); }
  main { max-width:880px; margin:0 auto; padding:18px 16px 60px; }
  .top { display:flex; align-items:center; gap:10px; padding:2px 2px 14px; }
  .brand { display:flex; align-items:center; gap:10px; flex:1; }
  .logo { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:linear-gradient(135deg, var(--accent), #ffb347); }
  .logo svg { width:17px; height:17px; }
  .top h1 { font-size:19px; margin:0; letter-spacing:-.02em; font-weight:650; }
  .badge { font-size:12px; font-weight:600; padding:5px 11px; border-radius:20px; border:1px solid var(--line2); color:var(--muted); display:flex; align-items:center; gap:6px; }
  .badge i { width:7px; height:7px; border-radius:50%; background:var(--warn); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:18px; margin-top:12px; }
  .eyebrow { font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:0 0 12px; display:flex; justify-content:space-between; }
  .muted { color:var(--muted); font-size:13px; }
  .ic { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; }
  .hero { display:flex; gap:14px; align-items:center; }
  .ring { width:64px; height:64px; flex:none; }
  .hero h2 { margin:0 0 3px; font-size:18px; font-weight:650; letter-spacing:-.015em; }
  .hero p { margin:0; color:var(--muted); font-size:14px; }
  .rooms { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px; margin-top:12px; }
  .room { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:16px; cursor:pointer; position:relative; overflow:hidden; transition:transform .15s; }
  .room:active { transform:scale(.985); }
  .room::after { content:""; position:absolute; inset:auto -40px -60px auto; width:160px; height:160px; border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%); pointer-events:none; }
  .room .hd { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .room .nm { font-weight:650; font-size:15.5px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .room .kd { font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.07em; }
  .temps { display:flex; align-items:baseline; gap:10px; margin:12px 0 8px; }
  .now { font-size:38px; font-weight:650; letter-spacing:-.04em; line-height:1; }
  .now small { font-size:16px; color:var(--muted); font-weight:500; }
  .arrow { color:var(--faint); }
  .want { font-size:20px; font-weight:650; color:var(--c); }
  .why { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:5px 10px; border-radius:10px;
    color:var(--c); background:color-mix(in srgb, var(--c) 13%, transparent); }
  .devs { margin-top:10px; font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 10px; }
  .devs b { color:var(--text); font-weight:600; }
  .flame { width:18px; height:18px; color:var(--heat); }
  .agreeok { color:var(--ok); } .agreeno { color:var(--warn); }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .sheet.open { display:flex; }
  .sheet .box { background:var(--surface); width:100%; max-width:560px; max-height:88vh; overflow:auto; border-radius:22px 22px 0 0; padding:20px 18px 30px; border:1px solid var(--line2); }
  .sheet h3 { margin:0 0 4px; font-size:19px; letter-spacing:-.02em; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  .row .t b { display:block; font-size:14.5px; font-weight:600; } .row .t span { font-size:12.5px; color:var(--muted); }
  select, input { background:var(--surface2); color:var(--text); border:1px solid var(--line2); border-radius:10px; padding:8px 10px; font:inherit; font-size:14px; max-width:200px; }
  input.num { width:76px; text-align:right; }
  .seg { display:flex; background:var(--surface2); border-radius:10px; padding:3px; gap:2px; flex-wrap:wrap; }
  .seg button { border:0; background:transparent; color:var(--muted); font:inherit; font-size:13px; font-weight:600; padding:6px 10px; border-radius:8px; cursor:pointer; }
  .seg button.on { background:var(--accent); color:#fff; }
  .btn { border:0; background:var(--accent); color:#fff; font:inherit; font-weight:650; padding:11px 16px; border-radius:12px; cursor:pointer; width:100%; margin-top:16px; }
  .ghost { background:transparent; color:var(--muted); border:1px solid var(--line2); }
  .calls { font:12px ui-monospace, Menlo, monospace; color:var(--faint); white-space:pre-wrap; margin-top:6px; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; margin-top:10px; }
  .tabs { position:sticky; top:0; z-index:5; display:flex; gap:4px; background:color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter:blur(12px); padding:6px 0 8px; }
  .tabs button { flex:1; border:1px solid var(--line); background:var(--surface); color:var(--muted); font:inherit; font-size:14px; font-weight:650; padding:10px; border-radius:14px; cursor:pointer; }
  .tabs button.on { color:var(--text); border-color:color-mix(in srgb, var(--accent) 50%, transparent); background:color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .status { display:flex; gap:14px; align-items:flex-start; position:relative; overflow:hidden; }
  .status::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:3px; background:var(--accent); }
  .dotc { width:38px; height:38px; flex:none; border-radius:12px; display:grid; place-items:center; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); margin-left:6px; }
  .status h2 { margin:0 0 4px; font-size:17px; font-weight:650; letter-spacing:-.015em; line-height:1.35; }
  .status p { margin:0; color:var(--muted); font-size:13.5px; }
  .house svg { width:100%; height:auto; display:block; }
  .tile { cursor:pointer; }
  .tile rect.bg { stroke-width:1.2; }
  .tile text { font-family:inherit; }
  .t-nm { font-size:11px; font-weight:650; fill:var(--muted); }
  .t-v { font-size:21px; font-weight:650; fill:var(--text); letter-spacing:-.03em; }
  .t-w { font-size:11px; font-weight:650; }
  .wave { fill:none; stroke:var(--heat); stroke-width:1.6; stroke-linecap:round; opacity:0; animation:rise 2.6s ease-in infinite; }
  .wave.w2 { animation-delay:.9s; } .wave.w3 { animation-delay:1.7s; }
  @keyframes rise { 0% { opacity:0; transform:translateY(6px); } 30% { opacity:.9; } 100% { opacity:0; transform:translateY(-12px); } }
  .metrics { display:grid; grid-template-columns:repeat(4, 1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:22px; overflow:hidden; margin-top:12px; }
  .metric { background:var(--surface); padding:15px; }
  .metric .lbl { font-size:10.5px; font-weight:650; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); }
  .metric .v { font-size:24px; font-weight:650; letter-spacing:-.03em; margin-top:7px; line-height:1.1; }
  .metric .v small { font-size:12px; font-weight:500; color:var(--muted); margin-left:2px; }
  .metric .s { font-size:11.5px; color:var(--muted); margin-top:4px; }
  .learn { display:grid; gap:8px; }
  .lrow { display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:8px 0; border-top:1px solid var(--line); }
  .lrow:first-child { border-top:0; } .lrow b { font-weight:600; } .lrow span { color:var(--muted); text-align:right; }
  .tl { display:grid; grid-template-columns:96px 1fr; gap:8px 10px; align-items:center; }
  .tl .nm { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bars { position:relative; height:22px; border-radius:7px; overflow:hidden; display:flex; background:var(--surface2); }
  .bars i { display:block; height:100%; }
  .nowline { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--text); border-radius:1px; }
  .axis { display:flex; justify-content:space-between; font-size:10.5px; color:var(--faint); margin-left:106px; margin-top:4px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:14px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:4px; margin-right:6px; vertical-align:-2px; }
  @media (max-width:520px) { .metrics { grid-template-columns:1fr 1fr; } .tl { grid-template-columns:74px 1fr; } .axis { margin-left:84px; } }
  .toggle { width:46px; height:28px; border-radius:14px; background:var(--surface2); border:1px solid var(--line2); position:relative; cursor:pointer; flex:none; transition:background .2s; }
  .toggle::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--muted); transition:all .2s; }
  .toggle.on { background:var(--accent); border-color:var(--accent); } .toggle.on::after { left:21px; background:#fff; }
  .empty { text-align:center; padding:40px 10px; color:var(--muted); }
  @media (max-width:520px) { .rooms { grid-template-columns:1fr 1fr; gap:10px; } .room { padding:13px; border-radius:18px; } .now { font-size:30px; } .want { font-size:16px; } .devs { display:none; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z"/></svg></div><h1 id="title">Varmepilot</h1></div>
    <div class="badge"><i></i><span id="mode"></span></div>
  </div>
  <div id="app"></div>
</main>
<div class="sheet" id="sheet"><div class="box" id="sheetbox"></div></div>
<script>
const L = (navigator.language || "en").slice(0, 2) === "da" ? "da" : "en";
const T = {
  da: { shadow: "Skygge", hero: "Kører i skygge", heroP: "Den viser, hvad den ville gøre i hvert rum – men styrer intet endnu.",
    agree: "{x} % enig med det, der styrer nu", away: "Alle ude – sænket", rooms: "Rum", why: { comfort: "Komfort", setback: "Sænket", night: "Nat", away: "Alle ude", window: "Vindue åbent", manual: "Skruet i hånden" },
    kinds: { living: "Stue", kitchen: "Køkken", bedroom: "Soveværelse", kids: "Børneværelse", bathroom: "Badeværelse", office: "Kontor", other: "Andet rum" },
    heating: { radiator: "Radiator", floor: "Gulvvarme" }, off: "Slukket", until: "til {t}", nowSet: "Står nu på", would: "Ville sende",
    kind: "Rumtype", heat: "Varme", sensor: "Rumføler", sensorH: "Temperaturen i rummet", none: "Termostatens egen", comfort: "Komfort", comfortH: "Når rummet bruges",
    setback: "Sænket", setbackH: "Om dagen, når det ikke bruges", night: "Nat", hours: "Komfort fra – til", hoursH: "Hvornår rummet bruges", exclude: "Styr ikke dette rum",
    save: "Gem", close: "Luk", found: "Fundet: {n} rum med {t} termostater", unplaced: "Termostater uden rum: {x} – giv dem et område i Home Assistant",
    empty: "Fandt ingen termostater. Giv dine termostater et område (rum) i Home Assistant, så finder Varmepilot dem.", search: "Søg igen", diag: "Hent diagnose",
    windows: "{n} vinduer/døre", presence: "{n} bevægelsessensorer", same: "Samme som nu", diff: "Anderledes end nu" },
  en: { shadow: "Shadow", hero: "Running in shadow", heroP: "It shows what it would do in each room – but controls nothing yet.",
    agree: "{x} % in line with what controls now", away: "Everyone away – turned down", rooms: "Rooms", why: { comfort: "Comfort", setback: "Setback", night: "Night", away: "Everyone away", window: "Window open", manual: "Turned by hand" },
    kinds: { living: "Living room", kitchen: "Kitchen", bedroom: "Bedroom", kids: "Kids' room", bathroom: "Bathroom", office: "Office", other: "Other room" },
    heating: { radiator: "Radiator", floor: "Floor heating" }, off: "Off", until: "until {t}", nowSet: "Set now to", would: "Would send",
    kind: "Kind of room", heat: "Heating", sensor: "Room sensor", sensorH: "The temperature in the room", none: "The thermostat's own", comfort: "Comfort", comfortH: "When the room is used",
    setback: "Setback", setbackH: "Daytime, when not used", night: "Night", hours: "Comfort from – to", hoursH: "When the room is used", exclude: "Don't control this room",
    save: "Save", close: "Close", found: "Found: {n} rooms with {t} thermostats", unplaced: "Thermostats with no room: {x} – give them an area in Home Assistant",
    empty: "No thermostats found. Give your thermostats an area (room) in Home Assistant and Heat Pilot will find them.", search: "Search again", diag: "Download diagnostics",
    windows: "{n} windows/doors", presence: "{n} motion sensors", same: "Same as now", diff: "Different from now" },
}[L];

Object.assign(T, L === "da" ? {
  tabs: { now: "Nu", plan: "Plan", rooms: "Rum", settings: "Indstillinger" },
  feat: { title: "Det kan den – fundet i dit hjem", hint: "Slår selv til, når udstyret findes. Det, du ikke har, vises ikke.",
    signals: ["Nogen er i rummet", "CO₂, fugt og lys holder rummet varmt, når man sidder stille"],
    shower: ["Bruser-hold", "Badeværelset holdes varmt en time efter et bad (fugten stiger)"],
    sun: ["Solen varmer gratis", "Venter med at varme op, når solen allerede varmer rummet"],
    weather: ["Vejret", "Lærer opvarmningstid efter udetemperaturen – starter tidligere, når det er koldt"],
    door: ["Hoveddøren", "Døren åbnes og ingen bevægelse i 10 min: alle er ude – huset sænkes"],
    manual: ["Skruet i hånden", "Når nogen drejer på en termostat, holdes deres temperatur en time"] }, sHeat: "{r} varmes op til kl. {t}", sHeatN: "{n} rum varmes op", sPre: "{r} varmes op, så det er varmt kl. {t}",
  sDown: "{n} rum er sænket, fordi ingen bruger dem", sDown1: "{r} er sænket, fordi ingen bruger det", sWin: "Vinduet i {r} er åbent – varmen er slukket",
  sAway: "Alle er ude – huset er sænket", sAllGood: "Alle rum har den temperatur, de skal have", sNight: "Natsænkning i {n} rum",
  mSaved: "Sænket i dag", mSavedS: "≈ {x} % mindre varme denne uge", mOnTime: "Varmt til tiden", mOnTimeS: "{n} gange målt", mHeating: "Varmer nu", mHeatingS: "af {n} rum", mOut: "Ude", mOutS: "fra vejret",
  dh: "°·t", learned: "Det har den lært", uses: "bruges {h}", notUsed: "bruges sjældent", rate: "{x} min pr. grad", rateDefault: "lærer opvarmningstid", learning: "lærer stadig",
  planTitle: "De næste 24 timer", planHint: "Varmen starter i god tid, så rummet er varmt, når det bruges.",
  why2: { preheat: "Varmer op i tide", occupied: "Nogen er her", shower: "Efter bad", sun: "Solen varmer" }, fixed: "Brug faste tider", fixedH: "I stedet for de lærte",
} : {
  tabs: { now: "Now", plan: "Plan", rooms: "Rooms", settings: "Settings" },
  feat: { title: "What it can do – found in your home", hint: "Turns itself on when the equipment is found. What you don't have isn't shown.",
    signals: ["Someone is in the room", "CO₂, humidity and lights keep the room warm when people sit still"],
    shower: ["Shower hold", "The bathroom is kept warm for an hour after a shower (humidity rises)"],
    sun: ["Free heat from the sun", "Waits with heating up when the sun is already warming the room"],
    weather: ["The weather", "Learns heat-up time by the outdoor temperature – starts earlier when it's cold"],
    door: ["The front door", "Door opened and no movement for 10 min: everyone is out – the house is turned down"],
    manual: ["Turned by hand", "When someone turns a thermostat, their temperature holds for an hour"] }, sHeat: "{r} heats until {t}", sHeatN: "{n} rooms are heating", sPre: "{r} heats up to be warm at {t}",
  sDown: "{n} rooms are turned down because nobody uses them", sDown1: "{r} is turned down because nobody uses it", sWin: "The window in {r} is open – heating is off",
  sAway: "Everyone is away – the house is turned down", sAllGood: "Every room is at the temperature it should be", sNight: "Night setback in {n} rooms",
  mSaved: "Turned down today", mSavedS: "≈ {x} % less heat this week", mOnTime: "Warm on time", mOnTimeS: "measured {n} times", mHeating: "Heating now", mHeatingS: "of {n} rooms", mOut: "Outside", mOutS: "from the weather",
  dh: "°·h", learned: "What it has learned", uses: "used {h}", notUsed: "rarely used", rate: "{x} min per degree", rateDefault: "learning heat-up time", learning: "still learning",
  planTitle: "The next 24 hours", planHint: "Heating starts in good time, so the room is warm when it is used.",
  why2: { preheat: "Heating up in time", occupied: "Someone is here", shower: "After a shower", sun: "The sun warms it" }, fixed: "Use fixed hours", fixedH: "Instead of the learned ones",
});
Object.assign(T.why, T.why2);
document.getElementById("title").textContent = L === "da" ? "Varmepilot" : "Heat Pilot";
document.getElementById("mode").textContent = T.shadow;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (v, d = 1) => v == null ? "–" : Number(v).toFixed(d).replace(".", L === "da" ? "," : ".");
const api = (p, body) => fetch(p.replace(/^\//, ""), body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}).then((r) => r.json());
const COL = { shower: "#ff9f6e", sun: "#f5c451", comfort: "var(--heat)", preheat: "#ffb347", occupied: "var(--heat)", setback: "var(--cool)", night: "#8b7bff", away: "var(--cool)", window: "var(--off)", manual: "var(--warn)" };
let tab = location.hash.slice(1) || "now";
const FLAME = `<svg class="flame" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c2.5 3.5 6 6 6 11a6 6 0 0 1-12 0c0-2.4 1.2-3.9 2.4-5 0 2.3 1.2 3.6 2.4 3.6 0-3.6-1.2-6 1.2-9.6z"/></svg>`;
let data = null;

function hhmm(iso) { if (!iso) return ""; const d = new Date(iso); return d.toLocaleTimeString(L, { hour: "2-digit", minute: "2-digit" }); }
function ring(p) {
  const r = 26, c = 2 * Math.PI * r, v = p == null ? 0 : p / 100;
  return `<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="6"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c * v} ${c}" transform="rotate(-90 32 32)"/>
    <text x="32" y="37" text-anchor="middle" font-size="15" font-weight="650" fill="currentColor">${p == null ? "–" : p + "%"}</text></svg>`;
}
function roomCard(r) {
  const w = r.want || {}, why = w.why || "comfort", c = COL[why] || "var(--heat)";
  const heating = (r.devices || []).some((d) => d.action === "heating");
  const devs = (r.devices || []).map((d) => `<span>${esc(d.brand)} <b>${d.state === "off" ? T.off : num(d.setpoint) + "°"}</b></span>`).join("");
  return `<div class="room" style="--c:${c}" data-room="${esc(r.area_id)}">
    <div class="hd"><div><div class="nm">${esc(r.name)}</div><div class="kd">${esc(T.kinds[r.kind] || r.kind)} · ${esc(T.heating[r.heating] || "")}</div></div>${heating ? FLAME : ""}</div>
    <div class="temps"><div class="now">${num(r.temp)}<small>°</small></div><span class="arrow">→</span><div class="want">${w.temp == null ? T.off : num(w.temp) + "°"}</div></div>
    <span class="why">${esc(T.why[why] || why)}${w.until && why !== "window" ? ` · ${T.until.replace("{t}", hhmm(w.until))}` : ""}</span>
    <div class="devs">${devs}</div></div>`;
}
function ranges(h) {
  if (!h || !h.length) return "";
  const out = []; let a = h[0], b = h[0];
  for (const x of h.slice(1).concat([null])) { if (x === b + 1) { b = x; continue; } out.push(a === b ? `${a}` : `${a}–${b + 1}`); if (x != null) a = b = x; }
  return out.join(", ");
}
function sentence(rooms) {
  const by = (w) => rooms.filter((r) => (r.want || {}).why === w);
  const parts = [];
  if (data.away) parts.push(T.sAway);
  const win = by("window"); win.forEach((r) => parts.push(T.sWin.replace("{r}", r.name)));
  const heat = rooms.filter((r) => r.heating && ["comfort", "occupied", "preheat", "manual"].includes((r.want || {}).why));
  const pre = by("preheat");
  if (pre.length) parts.push(T.sPre.replace("{r}", pre[0].name).replace("{t}", hhmm(pre[0].want.until)));
  else if (heat.length === 1) parts.push(T.sHeat.replace("{r}", heat[0].name).replace("{t}", hhmm(heat[0].want.until) || "–"));
  else if (heat.length > 1) parts.push(T.sHeatN.replace("{n}", heat.length));
  const down = by("setback");
  if (down.length === 1) parts.push(T.sDown1.replace("{r}", down[0].name)); else if (down.length > 1) parts.push(T.sDown.replace("{n}", down.length));
  const night = by("night"); if (night.length) parts.push(T.sNight.replace("{n}", night.length));
  return parts.length ? parts.join(". ") + "." : T.sAllGood + ".";
}
function houseSvg(rooms) {
  const W = 680, cols = rooms.length > 8 ? 4 : 3, tw = 150, th = 92, gx = 14, gy = 14;
  const rows = Math.ceil(rooms.length / cols), bw = cols * tw + (cols - 1) * gx + 40, bx = (W - bw) / 2, top = 96, bh = rows * th + (rows - 1) * gy + 40;
  const H = top + bh + 10;
  let tiles = "";
  rooms.forEach((r, i) => {
    const c = i % cols, row = Math.floor(i / cols), x = bx + 20 + c * (tw + gx), y = top + 20 + row * (th + gy);
    const w = r.want || {}, why = w.why || "comfort", col = COL[why] || "var(--heat)";
    const cold = r.temp != null && w.temp != null && r.temp < w.temp - 0.5;
    const waves = r.heating ? [0, 1, 2].map((k) => `<path class="wave w${k + 1}" d="M${x + tw - 34 + k * 9} ${y + 30} q4 -5 0 -10 q-4 -5 0 -10"/>`).join("") : "";
    tiles += `<g class="tile" data-room="${esc(r.area_id)}"><rect class="bg" x="${x}" y="${y}" width="${tw}" height="${th}" rx="14"
        fill="color-mix(in srgb, ${col} ${r.heating ? 22 : 10}%, var(--surface2))" stroke="color-mix(in srgb, ${col} 45%, transparent)"/>
      <text class="t-nm" x="${x + 12}" y="${y + 20}">${esc(r.name.length > 17 ? r.name.slice(0, 16) + "…" : r.name)}</text>
      <text class="t-v" x="${x + 12}" y="${y + 52}" ${cold ? 'style="fill:var(--cool)"' : ""}>${num(r.temp)}°</text>
      <text class="t-w" x="${x + 12}" y="${y + 76}" fill="${col}">${w.temp == null ? T.off : "→ " + num(w.temp) + "° · " + esc(T.why[why] || why)}</text>${waves}</g>`;
  });
  const roof = `<path d="M${bx - 18} ${top + 4} L${W / 2} 18 L${bx + bw + 18} ${top + 4}" fill="none" stroke="var(--line2)" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="${bx}" y="${top}" width="${bw}" height="${bh}" rx="18" fill="var(--surface)" stroke="var(--line2)" stroke-width="2"/>
    <rect x="${bx + bw - 70}" y="34" width="22" height="40" rx="3" fill="var(--surface2)" stroke="var(--line2)" stroke-width="2"/>`;
  const out = data.outdoor != null ? `<text x="${bx - 4}" y="64" font-size="13" font-weight="650" fill="var(--cool)">☁ ${num(data.outdoor)}°</text>` : "";
  return `<svg viewBox="0 0 ${W} ${H}">${roof}${out}${tiles}</svg>`;
}
function nowTab(rooms) {
  const lg = data.learning || {}, heating = rooms.filter((r) => r.heating).length;
  const learnRows = rooms.map((r) => `<div class="lrow"><b>${esc(r.name)}</b><span>${r.hours_today == null ? T.learning : r.hours_today.length ? T.uses.replace("{h}", ranges(r.hours_today)) : T.notUsed} · ${r.rate_n ? T.rate.replace("{x}", num(r.rate, 0)) : T.rateDefault}</span></div>`).join("");
  return `<div class="card status"><div class="dotc">${FLAME}</div><div><h2>${esc(sentence(rooms))}</h2><p>${T.heroP}${data.agree != null ? " · " + T.agree.replace("{x}", data.agree) : ""}</p></div></div>
    <div class="card house">${houseSvg(rooms)}</div>
    <div class="metrics">
      <div class="metric"><div class="lbl">${T.mSaved}</div><div class="v">${num(lg.today_dh)}<small>${T.dh}</small></div><div class="s">${lg.week_pct != null ? T.mSavedS.replace("{x}", num(lg.week_pct, 0)) : ""}</div></div>
      <div class="metric"><div class="lbl">${T.mOnTime}</div><div class="v">${lg.ontime != null ? lg.ontime + "<small>%</small>" : "–"}</div><div class="s">${lg.ontime_n ? T.mOnTimeS.replace("{n}", lg.ontime_n) : T.learning}</div></div>
      <div class="metric"><div class="lbl">${T.mHeating}</div><div class="v">${heating}</div><div class="s">${T.mHeatingS.replace("{n}", rooms.length)}</div></div>
      <div class="metric"><div class="lbl">${T.mOut}</div><div class="v">${num(data.outdoor)}<small>°</small></div><div class="s">${T.mOutS}</div></div>
    </div>
    <div class="card"><p class="eyebrow">${T.learned}</p><div class="learn">${learnRows}</div></div>`;
}
function planTab(rooms) {
  const now = new Date(data.now);
  const rowsHtml = rooms.map((r) => {
    const tl = r.timeline || [];
    const runs = [];
    tl.forEach((q) => { const last = runs[runs.length - 1]; if (last && last.why === q.why && last.temp === q.temp) last.n++; else runs.push({ ...q, n: 1 }); });
    const segs = runs.map((q) => `<i style="width:${100 * q.n / tl.length}%;background:color-mix(in srgb, ${COL[q.why] || "var(--heat)"} ${q.why === "comfort" ? 85 : q.why === "preheat" ? 70 : 35}%, transparent)" title="${hhmm(q.t)} ${num(q.temp)}°"></i>`).join("");
    return `<div class="nm">${esc(r.name)}</div><div class="bars">${segs}<span class="nowline" style="left:0"></span></div>`;
  }).join("");
  const t0 = now.getHours();
  const ticks = [0, 6, 12, 18, 24].map((h) => `<span>${String((t0 + h) % 24).padStart(2, "0")}</span>`).join("");
  const legend = ["comfort", "preheat", "setback", "night"].map((k) => `<span><i style="background:${COL[k]}"></i>${esc(T.why[k])}</span>`).join("");
  return `<div class="card"><p class="eyebrow">${T.planTitle}</p><p class="muted" style="margin:-4px 0 14px">${T.planHint}</p>
    <div class="tl">${rowsHtml}</div><div class="axis">${ticks}</div><div class="legend">${legend}</div></div>`;
}
function render() {
  const app = document.getElementById("app");
  if (!data) return;
  const rooms = data.rooms.filter((r) => !r.excluded);
  if (!data.rooms.length) {
    app.innerHTML = `<div class="card empty">${T.empty}<button class="btn" id="again">${T.search}</button></div>`;
    document.getElementById("again").onclick = async () => { await api("/api/discover", {}); load(); };
    return;
  }
  const nT = rooms.reduce((s, r) => s + r.thermostats.length, 0);
  const tabs = `<div class="tabs">${["now", "plan", "rooms", "settings"].map((k) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${T.tabs[k]}</button>`).join("")}</div>`;
  let body = "";
  if (tab === "plan") body = planTab(rooms);
  else if (tab === "rooms") body = `<div class="rooms">${data.rooms.map(roomCard).join("")}</div>
    <p class="muted" style="margin-top:14px">${T.found.replace("{n}", rooms.length).replace("{t}", nT)}${data.unplaced.length ? "<br>" + T.unplaced.replace("{x}", data.unplaced.map(esc).join(", ")) : ""}</p>
    <p class="muted"><a href="api/diagnostics" style="color:var(--muted)">${T.diag}</a></p>`;
  else if (tab === "settings") {
    const f = data.features || {};
    body = `<div class="card"><p class="eyebrow">${T.feat.title}</p><p class="muted" style="margin:-4px 0 6px">${T.feat.hint}</p>
      ${Object.keys(f).map((k) => `<div class="row"><div class="t"><b>${esc(T.feat[k][0])}</b><span>${esc(T.feat[k][1])}</span></div><button class="toggle ${f[k].on ? "on" : ""}" data-feat="${k}"></button></div>`).join("")}</div>`;
  }
  else body = nowTab(rooms);
  app.innerHTML = tabs + body;
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; location.hash = tab; render(); });
  document.querySelectorAll("[data-room]").forEach((el) => el.onclick = () => openRoom(el.dataset.room));
  document.querySelectorAll("[data-feat]").forEach((b) => b.onclick = async () => { await api("/api/feature", { key: b.dataset.feat, on: !b.classList.contains("on") }); load(); });
}
function openRoom(id) {
  const r = data.rooms.find((x) => x.area_id === id), c = r.cfg;
  const seg = (key, opts, cur, labels) => `<div class="seg" data-seg="${key}">${opts.map((o) => `<button data-v="${o}" class="${cur === o ? "on" : ""}">${esc(labels[o])}</button>`).join("")}</div>`;
  const numIn = (key, v) => `<input class="num" type="number" step="0.5" inputmode="decimal" data-k="${key}" value="${v}">`;
  const now = (r.devices || []).map((d) => `${esc(d.name)}: ${d.state === "off" ? T.off : num(d.setpoint) + "°"}`).join("<br>");
  const calls = (r.calls || []).map((x) => `${x.domain}.${x.service} ${JSON.stringify(Object.fromEntries(Object.entries(x.data).filter(([k]) => k !== "entity_id")))}`).join("\n");
  document.getElementById("sheetbox").innerHTML = `<h3>${esc(r.name)}</h3><p class="muted">${T.windows.replace("{n}", r.windows.length)} · ${T.presence.replace("{n}", r.presence.length)} · <span class="${r.same ? "agreeok" : "agreeno"}">${r.same ? T.same : T.diff}</span></p>
    <div class="row"><div class="t"><b>${T.kind}</b></div>${`<select data-k="kind">${Object.keys(T.kinds).map((k) => `<option value="${k}" ${r.kind === k ? "selected" : ""}>${esc(T.kinds[k])}</option>`).join("")}</select>`}</div>
    <div class="row"><div class="t"><b>${T.heat}</b></div>${seg("heating", ["radiator", "floor"], r.heating, T.heating)}</div>
    <div class="row"><div class="t"><b>${T.sensor}</b><span>${T.sensorH}</span></div><select data-k="temp_sensor"><option value="">${T.none}</option>${(r.temp_options || []).map((e) => `<option value="${esc(e)}" ${r.temp_sensor === e ? "selected" : ""}>${esc(e)}</option>`).join("")}</select></div>
    <div class="row"><div class="t"><b>${T.comfort}</b><span>${T.comfortH}</span></div>${numIn("comfort", c.comfort)}</div>
    <div class="row"><div class="t"><b>${T.hours}</b><span>${T.hoursH}</span></div><span><input class="num" type="number" min="0" max="24" data-k="day_from" value="${c.day_from}"> – <input class="num" type="number" min="0" max="24" data-k="day_to" value="${c.day_to}"></span></div>
    <div class="row"><div class="t"><b>${T.fixed}</b><span>${T.fixedH}${r.hours_today ? " · " + T.uses.replace("{h}", ranges(r.hours_today)) : ""}</span></div><input type="checkbox" data-k="fixed_hours" ${r.fixed_hours ? "checked" : ""}></div>
    <div class="row"><div class="t"><b>${T.setback}</b><span>${T.setbackH}</span></div>${numIn("setback", c.setback)}</div>
    <div class="row"><div class="t"><b>${T.night}</b></div>${numIn("night", c.night)}</div>
    <div class="row"><div class="t"><b>${T.exclude}</b></div><input type="checkbox" data-k="excluded" ${r.excluded ? "checked" : ""}></div>
    <details><summary>${T.nowSet} / ${T.would}</summary><p class="muted">${now}</p><div class="calls">${esc(calls)}</div></details>
    <button class="btn" id="save">${T.save}</button><button class="btn ghost" id="close">${T.close}</button>`;
  const sheet = document.getElementById("sheet");
  sheet.classList.add("open");
  const vals = {};
  sheet.querySelectorAll("[data-seg] button").forEach((b) => b.onclick = () => { const s = b.parentElement; s.querySelectorAll("button").forEach((x) => x.classList.remove("on")); b.classList.add("on"); vals[s.dataset.seg] = b.dataset.v; });
  sheet.querySelectorAll("[data-k]").forEach((el) => el.onchange = () => { vals[el.dataset.k] = el.type === "checkbox" ? el.checked : el.type === "number" ? (el.value === "" ? null : Number(el.value.replace(",", "."))) : el.value || null; });
  document.getElementById("close").onclick = () => sheet.classList.remove("open");
  sheet.onclick = (e) => { if (e.target === sheet) sheet.classList.remove("open"); };
  document.getElementById("save").onclick = async () => { await api("/api/room", { area_id: id, ...vals }); sheet.classList.remove("open"); load(); };
}
async function load() { try { data = await api("/api/status"); render(); } catch (e) { /* tries again */ } }
load();
setInterval(() => { if (!document.getElementById("sheet").classList.contains("open")) load(); }, 30000);
</script>
