<style>

      + grp("comfort", T.gComfort, T.gComfortH, ["signals", "shower", "sun", "weather", "manual", "strategy", "floor"].map(featRow).join("") + generalOf(["night_from", "night_to", "window_min"]))
      + grp("away", T.gAway, T.gAwayH, ["people", "door", "doors", "holiday", "summer"].map(featRow).join("") + generalOf(["away_temp"]))
      + grp("energy", T.gEnergy, T.gEnergyH, featRow("district") + dh + featRow("price") + featRow("ventilation") + vent)
      + `<details class="grp" data-g="msg" ${grpOpen.msg ? "open" : ""}><summary><div><b>${T.mTitle}</b><br><span>${T.gMsgH}</span></div></summary><div class="gin">${msgCard().replace('<div class="card">', "<div>")}</div></details>`;
  }
  else body = nowTab(rooms);
  app.innerHTML = tabs + body;
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; location.hash = tab; render(); });
  document.querySelectorAll("[data-room]").forEach((el) => el.onclick = () => openRoom(el.dataset.room));
  const ash = document.getElementById("allshadow"); if (ash) ash.onclick = async () => { await api("/api/mode", { area_id: null, mode: "shadow" }); load(); };
  const actl = document.getElementById("allcontrol"); if (actl) actl.onclick = async () => { if (!confirm(T.ctlHouseQ)) return; await api("/api/mode", { area_id: "*", mode: "control" }); load(); };
  document.querySelectorAll("[data-tune]").forEach((b) => b.onclick = async () => { await api("/api/tune", { key: b.dataset.tune, value: Number(b.dataset.v) }); load(); });
  document.querySelectorAll("[data-target]").forEach((b) => b.onclick = async () => { const t = new Set((data.messages || {}).targets || []); t.has(b.dataset.target) ? t.delete(b.dataset.target) : t.add(b.dataset.target); await api("/api/messages", { targets: [...t] }); load(); });
  document.querySelectorAll("[data-mnight]").forEach((b) => b.onclick = async () => { await api("/api/messages", { night: !b.classList.contains("on") }); load(); });
  document.querySelectorAll("[data-mkind]").forEach((b) => b.onclick = async () => { await api("/api/messages", { kind: b.dataset.mkind, on: !b.classList.contains("on") }); load(); });
  document.querySelectorAll("[data-vcool]").forEach((el) => el.onchange = async () => { await api("/api/ventilation", { cooling_entity: el.value || null }); load(); });
  document.querySelectorAll("[data-dh]").forEach((el) => el.onchange = async () => { await api("/api/district", { [el.dataset.dh]: el.value === "" ? null : Number(el.value.replace(",", ".")) }); load(); });
  document.querySelectorAll("[data-feat]").forEach((b) => b.onclick = async () => { await api("/api/feature", { key: b.dataset.feat, on: !b.classList.contains("on") }); load(); });
}
function roomChart(h, col) {
  const past = (h.past || []).map((p) => ({ t: new Date(p.t).getTime(), v: deg(p.temp) }));
  const plan = (h.plan || []).map((p) => ({ t: new Date(p.t).getTime(), v: deg(p.temp) }));
  if (!past.length && !plan.length) return `<div class="muted">–</div>`;
  const all = past.concat(plan), W = 520, H = 170, pl = 30, pr = 20, pt = 10, pb = 22;
  const t0 = Math.min(...all.map((p) => p.t)), t1 = Math.max(...all.map((p) => p.t));
  const vs = all.map((p) => p.v).filter((v) => v != null), lo = Math.floor(Math.min(...vs) - 0.5), hi = Math.ceil(Math.max(...vs) + 0.5);
  const x = (t) => pl + (t - t0) / Math.max(1, t1 - t0) * (W - pl - pr), y = (v) => pt + (hi - v) / Math.max(0.5, hi - lo) * (H - pt - pb);
  const line = (pts) => pts.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
  const step = (pts) => pts.map((p, i) => i ? `H${x(p.t).toFixed(1)} V${y(p.v).toFixed(1)}` : `M${x(p.t).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
  const now = Date.now(), grid = [];
  for (let v = lo; v <= hi; v += Math.max(1, Math.round((hi - lo) / 4))) grid.push(`<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--faint)">${v}°</text>`);
  const ticks = [];
  for (let k = 0; k <= 4; k++) { const t = t0 + (t1 - t0) * k / 4, d = new Date(t); ticks.push(`<text x="${x(t)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--faint)">${String(d.getHours()).padStart(2, "0")}:00</text>`); }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid.join("")}${ticks.join("")}
    ${plan.length ? `<path d="${step(plan)}" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="5 4"/>` : ""}
    ${past.length ? `<path d="${line(past)}" fill="none" stroke="var(--text)" stroke-width="2"/>` : ""}
    <line x1="${x(now)}" x2="${x(now)}" y1="${pt}" y2="${H - pb}" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}
function openRoom(id) {
  const r = data.rooms.find((x) => x.area_id === id), c = r.cfg;
  const seg = (key, opts, cur, labels) => `<div class="seg" data-seg="${key}">${opts.map((o) => `<button data-v="${o}" class="${cur === o ? "on" : ""}">${esc(labels[o])}</button>`).join("")}</div>`;
  const waterFloor = r.heat_type === "floor" && r.floor_kind !== "electric", drop = c.floor_drop ?? 2;
  const low = (k, v) => waterFloor && ["setback", "night"].includes(k) ? Math.max(v, c.comfort - drop) : v;  // what the thermostat really gets
  const floorNote = waterFloor ? `<span class="floornote">${T.floorH.replace("{x}", num(ddeg(drop), 0))}</span>` : "";
  const numIn = (key, v0) => { const v = low(key, v0); return `<div class="stepper" data-step="${key}" data-val="${v}"><button data-d="-0.5">−</button><b>${num(deg(v))}°</b><button data-d="0.5">+</button></div>`; };
  const hourSel = (key, v) => `<select data-k="${key}">${Array.from({ length: 25 }, (_, h) => `<option value="${h}" ${Number(v) === h ? "selected" : ""}>${String(h).padStart(2, "0")}:00</option>`).join("")}</select>`;
  const now = (r.devices || []).map((d) => `${esc(d.name)}: ${d.state === "off" ? T.off : num(deg(d.setpoint)) + "°"}`).join("<br>");
  const calls = (r.calls || []).map((x) => `${x.domain}.${x.service} ${JSON.stringify(Object.fromEntries(Object.entries(x.data).filter(([k]) => k !== "entity_id")))}`).join("\n");
  const w = r.want || {}, why = w.why || "comfort", col = COL[why] || "var(--heat)";
  const top = `<div class="rtop"><div><div class="muted">${T.roomNow}</div><div class="now">${num(deg(r.temp))}<small>°</small></div></div>
      <div class="arrow" style="font-size:22px">→</div><div><div class="muted">${T.roomWant}</div><div class="now" style="color:${col}">${w.temp == null ? T.off : num(deg(w.temp)) + "<small>°</small>"}</div></div></div>
    <div class="whybox" style="--c:${col}"><b>${esc(T.why[why] || why)}</b><span>${esc((T.whyLong || {})[why] || "")}${w.until && why !== "window" ? " " + WD[3] + hhmm(w.until) + "." : ""}</span></div>
    <p class="eyebrow" style="margin-top:16px">${T.dayChart}</p><div id="roomchart" class="chart"><div class="muted">…</div></div>
    <div class="legend" style="margin-top:6px"><span><i style="background:var(--text)"></i>${T.chartPast}</span><span><i style="background:${col}"></i>${T.chartPlan}</span></div>
    <p class="eyebrow" style="margin-top:18px">${T.devicesT}</p><div class="muted">${(r.devices || []).map((d) => `${esc(d.name)} · ${esc(d.brand)} · ${d.state === "off" ? T.off : num(deg(d.setpoint)) + "°"}${d.action === "heating" ? " 🔥" : ""}`).join("<br>")}</div>
    <p class="eyebrow" style="margin-top:18px">${T.modeT}</p>
    <div class="row" style="border-top:0"><div class="t"><span>${T.modeH}</span></div><div class="seg" data-modeseg>${["shadow", "control", "off"].map((m) => `<button data-mode="${m}" class="${(r.mode || "shadow") === m ? "on" : ""}">${T.modes[m]}</button>`).join("")}</div></div>
    <p class="eyebrow" style="margin-top:18px">${T.settingsT}</p>`;
  document.getElementById("sheetbox").innerHTML = `<h3>${esc(r.name)}</h3><p class="muted">${T.windows.replace("{n}", r.windows.length)} · ${T.presence.replace("{n}", r.presence.length)} · <span class="${r.same ? "agreeok" : "agreeno"}">${r.same ? T.same : T.diff}</span></p>${top}
    <div class="row"><div class="t"><b>${T.comfort}</b><span>${T.comfortH}${r.comfort_learned ? " · " + T.learnedC : ""}</span></div>${numIn("comfort", c.comfort)}</div>
    <div class="row"><div class="t"><b>${T.hours}</b><span>${T.hoursH}</span></div><span>${hourSel("day_from", c.day_from)} – ${hourSel("day_to", c.day_to)}</span></div>
    <div class="row"><div class="t"><b>${T.night}</b>${floorNote}</div>${numIn("night", c.night)}</div>
    <details class="adj" style="margin-top:12px"><summary>${T.moreSet}</summary>
    <div class="row"><div class="t"><b>${T.eveningOn}</b><span>${T.eveningH}</span></div><input type="checkbox" data-evon ${c.evening != null ? "checked" : ""}></div>
    <div class="evrow" style="${c.evening != null ? "" : "display:none"}"><div class="row"><div class="t"><b>${T.evening}</b></div>${numIn("evening", c.evening ?? (c.comfort + 1))}</div>
    <div class="row"><div class="t"><b>${T.hours}</b></div><span>${hourSel("evening_from", c.evening_from ?? 15)} – ${hourSel("evening_to", c.evening_to ?? 22)}</span></div></div>
    <div class="row"><div class="t"><b>${T.setback}</b><span>${T.setbackH}</span>${floorNote}</div>${numIn("setback", c.setback)}</div>
    <div class="row"><div class="t"><b>${T.kind}</b></div>${`<select data-k="kind">${Object.keys(T.kinds).map((k) => `<option value="${k}" ${r.kind === k ? "selected" : ""}>${esc(T.kinds[k])}</option>`).join("")}</select>`}</div>
    <div class="row"><div class="t"><b>${T.heat}</b></div>${seg("heating", ["radiator", "floor", "heatpump", "electric"], r.heat_type, T.heating)}</div>
    <div class="row"><div class="t"><b>${T.sensor}</b><span>${T.sensorH}</span></div><select data-k="temp_sensor"><option value="">${T.none}</option>${(r.temp_options || []).map((e) => `<option value="${esc(e)}" ${r.temp_sensor === e ? "selected" : ""}>${esc((r.temp_names || {})[e] || e)}</option>`).join("")}</select></div>
    ${(data.persons || []).length ? `<div class="row"><div class="t"><b>${T.owner}</b><span>${T.ownerH}</span></div><select data-k="owner"><option value="">${T.nobody}</option>${(r.owner || "").includes(",") ? `<option value="${esc(r.owner)}" selected>${esc(r.owner.split(",").map((e) => (data.persons.find((p) => p.entity_id === e) || {}).name || e).join(" & "))}</option>` : ""}${data.persons.map((p) => `<option value="${esc(p.entity_id)}" ${r.owner === p.entity_id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>` : ""}
    <div class="row"><div class="t"><b>${T.fixed}</b><span>${T.fixedH}${r.hours_today ? " · " + T.uses.replace("{h}", ranges(r.hours_today)) : ""}</span></div><input type="checkbox" data-k="fixed_hours" ${r.fixed_hours ? "checked" : ""}></div>
    ${(data.all_doors || []).length ? `<div class="row" style="flex-direction:column;align-items:stretch"><div class="t"><b>${T.doorsT}</b><span>${T.doorsH}</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${data.all_doors.map((d) => `<button class="chipb ${(r.doors || []).includes(d.entity_id) ? "on" : ""}" data-door="${esc(d.entity_id)}">${esc(d.name)}</button>`).join("")}</div></div>` : ""}
    <div class="row"><div class="t"><b>${T.exclude}</b></div><input type="checkbox" data-k="excluded" ${r.excluded ? "checked" : ""}></div>
    </details>
    <details><summary>${T.nowSet} / ${T.would}</summary><p class="muted">${now}</p><div class="calls">${esc(calls)}</div></details>
    <button class="btn" id="save">${T.save}</button><button class="btn ghost" id="close">${T.close}</button>`;
  const sheet = document.getElementById("sheet");
  sheet.classList.add("open");
  api("/api/history?area=" + encodeURIComponent(id)).then((h) => { const el = document.getElementById("roomchart"); if (el) el.innerHTML = roomChart(h, col); }).catch(() => {});
  const vals = {};
  sheet.querySelectorAll("[data-seg] button").forEach((b) => b.onclick = () => { const s = b.parentElement; s.querySelectorAll("button").forEach((x) => x.classList.remove("on")); b.classList.add("on"); vals[s.dataset.seg] = b.dataset.v; });
  sheet.querySelectorAll("[data-mode]").forEach((b) => b.onclick = async () => {
    const m = b.dataset.mode;
    if (m === "control" && !confirm(T.confirmCtl.replace("{r}", r.name))) return;
    await api("/api/mode", { area_id: id, mode: m });
    sheet.querySelectorAll("[data-mode]").forEach((x) => x.classList.toggle("on", x === b));
    load();
  });
  sheet.querySelectorAll("[data-door]").forEach((b) => b.onclick = () => {
    b.classList.toggle("on");
    vals.doors_extra = [...sheet.querySelectorAll("[data-door].on")].map((x) => x.dataset.door);
  });
  sheet.querySelectorAll("[data-evon]").forEach((el) => el.onchange = () => {
    sheet.querySelector(".evrow").style.display = el.checked ? "" : "none";
    vals.evening = el.checked ? Number(sheet.querySelector('[data-step="evening"]').dataset.val) : null;
  });
  sheet.querySelectorAll("[data-step]").forEach((st) => st.querySelectorAll("button").forEach((b) => b.onclick = () => {
    const comfortNow = () => Number((sheet.querySelector('[data-step="comfort"]') || {}).dataset?.val ?? c.comfort);
    const floorAt = (k) => waterFloor && ["setback", "night"].includes(k) ? comfortNow() - drop : 5;
    const set = (el, v) => { el.dataset.val = v; el.querySelector("b").textContent = num(deg(v)) + "°"; vals[el.dataset.step] = v; };
    set(st, Math.max(floorAt(st.dataset.step), Math.min(30, Number(st.dataset.val) + Number(b.dataset.d))));
    if (waterFloor && st.dataset.step === "comfort")  // setback and night follow comfort up: never more than the drop below it
      ["setback", "night"].forEach((k) => { const el = sheet.querySelector(`[data-step="${k}"]`); if (el && Number(el.dataset.val) < floorAt(k)) set(el, floorAt(k)); });
  }));
  sheet.querySelectorAll("[data-k]:not([data-evon])").forEach((el) => el.onchange = () => { vals[el.dataset.k] = el.type === "checkbox" ? el.checked : el.type === "number" ? (el.value === "" ? null : Number(el.value.replace(",", "."))) : el.dataset.k === "owner" ? el.value : ["day_from", "day_to", "evening_from", "evening_to"].includes(el.dataset.k) ? Number(el.value) : el.value || null; });
  document.getElementById("close").onclick = () => sheet.classList.remove("open");
  sheet.onclick = (e) => { if (e.target === sheet) sheet.classList.remove("open"); };
  document.getElementById("save").onclick = async () => { await api("/api/room", { area_id: id, ...vals }); sheet.classList.remove("open"); load(); };
}
async function load() { try { data = await api("/api/status"); render(); if (openFirst) { const id = openFirst; openFirst = null; openRoom(id); } } catch (e) { /* tries again */ } }
load();
setInterval(() => { if (!document.getElementById("sheet").classList.contains("open")) load(); }, 30000);
document.addEventListener("toggle", (e) => { const d = e.target; if (d.id === "alerts") alertsOpen = d.open; else if (d.classList && d.classList.contains("more")) moreOpen = d.open; }, true);
</script>
