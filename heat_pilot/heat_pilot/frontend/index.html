<title>Varmepilot</title>
<style>

  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;

  main { max-width:880px; margin:0 auto; padding:18px 16px 60px; }

  .status h2 { margin:0 0 4px; font-size:17px; font-weight:650; letter-spacing:-.015em; line-height:1.35; }

  .tile { cursor:pointer; }
  .tile rect.bg { stroke-width:1.2; }
  .tile text { font-family:inherit; }
  .t-nm { font-size:12px; font-weight:650; fill:var(--muted); }
  .t-v { font-size:21px; font-weight:650; fill:var(--text); letter-spacing:-.03em; }
  .t-w { font-size:11px; font-weight:650; }

  .metric .v { font-size:24px; font-weight:650; letter-spacing:-.03em; margin-top:7px; line-height:1.1; }

  .bars { position:relative; height:22px; border-radius:7px; overflow:hidden; display:flex; background:var(--surface2); }

  .toggle.on { background:var(--accent); border-color:var(--accent); } .toggle.on::after { left:21px; background:#fff; }
  .tunerow { display:flex; flex-direction:column; gap:8px; padding:4px 0 14px 0; margin-top:-4px; }
  .tunerow > span { font-size:12.5px; color:var(--muted); }
  .seg.mini button { padding:6px 11px; font-size:12.5px; }
  .stepper { display:flex; align-items:center; gap:6px; }
  .stepper button { width:34px; height:34px; border-radius:10px; border:1px solid var(--line2); background:var(--surface2); color:var(--text); font-size:18px; font-weight:600; cursor:pointer; }
  .stepper b { min-width:52px; text-align:center; font-size:16px; }
  .alert { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); }
  .alert:first-of-type { border-top:0; padding-top:0; }
  .alert .ai { width:26px; height:26px; flex:none; border-radius:9px; display:grid; place-items:center; font-weight:800; color:var(--warn); background:color-mix(in srgb, var(--warn) 16%, transparent); }
  .alert b { font-size:14px; }
  .chipb { border:1px solid var(--line2); background:var(--surface2); color:var(--muted); font:inherit; font-size:13px; font-weight:600; padding:7px 12px; border-radius:10px; cursor:pointer; }
  .chipb.on { background:color-mix(in srgb, var(--accent) 18%, var(--surface2)); color:var(--text); border-color:var(--accent); }
  .empty { text-align:center; padding:40px 10px; color:var(--muted); }
  @media (max-width:520px) { .rooms { grid-template-columns:1fr 1fr; gap:10px; } .room { padding:13px; border-radius:18px; } .now { font-size:30px; } .want { font-size:16px; } .devs { display:none; } }
</style>
</head>

    <div style="display:flex;gap:6px;margin-top:14px;padding:10px;border-radius:14px;background:var(--surface2)">${box(T.vOut, t.outdoor, "var(--cool)")}${box(T.vSup, t.supply, "var(--ok)")}${box(T.vExt, t.extract, "var(--heat)")}${box(T.vExh, t.exhaust, "var(--muted)")}</div>
    <div class="muted" style="margin-top:8px">${T.vEff} ${v.efficiency != null ? v.efficiency + " %" : "–"} · ${T.vBypass} ${v.bypass == null ? "–" : v.bypass ? T.vOpen : T.vClosed}</div></div>`;
}
function dhCard() {
  const c = data.cooling, n = data.cooling_now;
  if (!c || !n) return "";
  const need = c.need, ref = c.year ?? c.week ?? c.today ?? n.now, good = need == null || ref >= need;
  const pct = Math.max(0, Math.min(100, (n.now / 45) * 100)), needPct = need ? (need / 45) * 100 : null;
  return `<div class="card"><p class="eyebrow">${T.dhTitle}<span style="color:${good ? "var(--ok)" : "var(--warn)"}">${good ? "✓" : "!"}</span></p>
    <div style="display:flex;align-items:baseline;gap:10px"><div class="now">${num(n.now)}<small>°</small></div><span class="muted">${T.dhNow} · ${T.dhSupRet.replace("{s}", num(n.supply, 0)).replace("{r}", num(n.return, 0))}</span></div>
    <div style="position:relative;height:8px;border-radius:4px;background:var(--surface2);margin:12px 0 6px;overflow:visible">
      <div style="height:100%;width:${pct}%;border-radius:4px;background:linear-gradient(90deg, var(--cool), var(--ok))"></div>
      ${needPct ? `<span style="position:absolute;left:${needPct}%;top:-4px;bottom:-4px;width:2px;background:var(--text)"></span>` : ""}</div>
    <div class="muted" style="color:${good ? "var(--ok)" : "var(--warn)"};font-weight:600">${good ? T.dhGood : T.dhBad}</div>
    <div class="muted">${T.dhToday} ${num(c.today)}° · ${T.dhYear} ${num(c.year)}° · ${T.dhNeed} ${num(need, 0)}°${c.per_mwh != null ? " · " + T.dhPer.replace("{x}", (c.per_mwh > 0 ? "+" : "") + num(c.per_mwh, 2)) : ""}</div></div>`;
}
function nowTab(rooms) {
  const lg = data.learning || {}, heating = rooms.filter((r) => r.heating).length;
  const sunMax = (g) => g ? Math.max(...Object.values(g)) : 0;
  const learnRows = rooms.map((r) => `<div class="lrow"><b>${esc(r.name)}</b><span>${r.hours_today == null ? T.learning : r.hours_today.length ? T.uses.replace("{h}", ranges(r.hours_today)) : T.notUsed} · ${r.rate_n ? T.rate.replace("{x}", num(r.rate, 0)) : T.rateDefault}${r.loss ? " · " + T.lossTxt.replace("{x}", num(r.loss * 20, 1)) : ""}${sunMax(r.sun_gain) > 0.2 ? " · " + T.sunTxt.replace("{x}", num(sunMax(r.sun_gain), 1)) : ""}${r.comfort_learned ? " · " + num(r.cfg.comfort) + "° " + T.learnedC : ""}</span></div>`).join("");
  return `<div class="card status"><div class="dotc">${FLAME}</div><div><h2>${esc(sentence(rooms))}</h2><p>${T.heroP}${data.agree != null ? " · " + T.agree.replace("{x}", data.agree) : ""}</p></div></div>
    ${(data.alerts || []).length ? `<div class="card"><p class="eyebrow">${T.aTitle}</p>${data.alerts.map((a) => `<div class="alert"><span class="ai">!</span><div><b>${esc(T.kinds[a.kind] || a.kind)}</b><div class="muted">${esc(a.text)}</div></div></div>`).join("")}</div>` : ""}
    <div class="card house">${houseSvg(rooms)}</div>
    <div class="metrics">
      <div class="metric"><div class="lbl">${T.mSaved}</div><div class="v">${num(lg.today_dh)}<small>${T.dh}</small></div><div class="s">${lg.week_pct != null ? T.mSavedS.replace("{x}", num(lg.week_pct, 0)) : ""}</div></div>
      <div class="metric"><div class="lbl">${T.mOnTime}</div><div class="v">${lg.ontime != null ? lg.ontime + "<small>%</small>" : "–"}</div><div class="s">${lg.ontime_n ? T.mOnTimeS.replace("{n}", lg.ontime_n) : T.learning}</div></div>
      <div class="metric"><div class="lbl">${T.mHeating}</div><div class="v">${heating}</div><div class="s">${T.mHeatingS.replace("{n}", rooms.length)}</div></div>
      <div class="metric"><div class="lbl">${T.mOut}</div><div class="v">${num(data.outdoor)}<small>°</small></div><div class="s">${T.mOutS}</div></div>
    </div>
    ${data.month ? `<div class="card"><p class="eyebrow">${T.repTitle} · ${esc(data.month.month)}</p><div>${T.repText.replace("{dh}", data.month.degree_hours).replace("{pct}", num(data.month.pct, 0)).replace("{ot}", data.month.ontime != null ? data.month.ontime + " %" : "–")}</div></div>` : ""}
    ${ventCard()}
    ${dhCard()}
    ${(data.persons || []).length ? `<div class="card"><p class="eyebrow">${T.who}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${data.persons.map((p) => `<span class="why" style="--c:${p.home ? "var(--ok)" : "var(--off)"}">${esc(p.name)} · ${p.home ? T.home : T.awayP}</span>`).join("")}</div></div>` : ""}
    <div class="card"><p class="eyebrow">${T.learned}</p>${data.arm ? `<p class="muted" style="margin:-4px 0 8px">${T.armToday}: ${esc(T.arm[data.arm] || data.arm)}${data.cold_snap ? " · " + T.coldSnap : ""}</p>` : ""}<div class="learn">${learnRows}</div></div>`;
}
function planTab(rooms) {
  const now = new Date(data.now);
  const rowsHtml = rooms.map((r) => {
    const tl = r.timeline || [];
    const runs = [];
    tl.forEach((q) => { const last = runs[runs.length - 1]; if (last && last.why === q.why && last.temp === q.temp) last.n++; else runs.push({ ...q, n: 1 }); });
    const segs = runs.map((q) => `<i style="width:${100 * q.n / tl.length}%;background:color-mix(in srgb, ${COL[q.why] || "var(--heat)"} ${q.why === "comfort" ? 85 : q.why === "preheat" ? 70 : 35}%, transparent)" title="${hhmm(q.t)} ${num(q.temp)}°"></i>`).join("");
    return `<div class="nm">${esc(r.name)}</div><div class="bars">${segs}<span class="nowline" style="left:0"></span></div>`;
  }).join("");
  const t0 = now.getHours();
  const ticks = [0, 6, 12, 18, 24].map((h) => `<span>${String((t0 + h) % 24).padStart(2, "0")}</span>`).join("");
  const legend = ["comfort", "preheat", "setback", "night"].map((k) => `<span><i style="background:${COL[k]}"></i>${esc(T.why[k])}</span>`).join("");
  return `<div class="card"><p class="eyebrow">${T.planTitle}</p><p class="muted" style="margin:-4px 0 14px">${T.planHint}</p>
    <div class="tl">${rowsHtml}</div><div class="axis">${ticks}</div><div class="legend">${legend}</div></div>`;
}
function render() {
  const app = document.getElementById("app");
  if (!data) return;
  const rooms = data.rooms.filter((r) => !r.excluded);
  if (!data.rooms.length) {
    app.innerHTML = `<div class="card empty">${T.empty}<button class="btn" id="again">${T.search}</button></div>`;
    document.getElementById("again").onclick = async () => { await api("/api/discover", {}); load(); };
    return;
  }
  const nT = rooms.reduce((s, r) => s + r.thermostats.length, 0);
  const tabs = `<div class="tabs">${["now", "plan", "rooms", "settings"].map((k) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${T.tabs[k]}</button>`).join("")}</div>`;
  let body = "";
  if (tab === "plan") body = planTab(rooms);
  else if (tab === "rooms") body = `<div class="rooms">${data.rooms.map(roomCard).join("")}</div>
    <p class="muted" style="margin-top:14px">${T.found.replace("{n}", rooms.length).replace("{t}", nT)}${data.unplaced.length ? "<br>" + T.unplaced.replace("{x}", data.unplaced.map(esc).join(", ")) : ""}</p>
    <p class="muted"><a href="api/diagnostics" style="color:var(--muted)">${T.diag}</a></p>`;
  else if (tab === "settings") {
    const f = data.features || {};
    body = `<div class="card"><p class="eyebrow">${T.feat.title}</p><p class="muted" style="margin:-4px 0 6px">${T.feat.hint}</p>
      ${Object.keys(f).map((k) => `<div class="row"><div class="t"><b>${esc(T.feat[k][0])}</b><span>${esc(T.feat[k][1])}</span></div><button class="toggle ${f[k].on ? "on" : ""}" data-feat="${k}"></button></div>${f[k].on ? tuneRows(k) : ""}`).join("")}</div>
      <div class="card"><p class="eyebrow">${T.general}</p>${tuneRows(null)}</div>
      ${msgCard()}
      ${f.ventilation && f.ventilation.on ? `<div class="card"><p class="eyebrow">${T.vTitle}</p>
        <div class="row"><div class="t"><b>${T.vCool}</b><span>${T.vCoolH}</span></div><select data-vcool><option value="">${T.vNone}</option>${(data.cooling_options || []).map((o) => `<option value="${esc(o.entity_id)}" ${data.ventilation.cooling_entity === o.entity_id ? "selected" : ""}>${esc(o.name)}</option>`).join("")}</select></div></div>` : ""}
      ${f.district && f.district.on ? `<div class="card"><p class="eyebrow">${T.dhTitle}</p>
        <div class="row"><div class="t"><b>${T.dhSet}</b><span>${T.dhSetH}</span></div><input class="num" type="number" step="1" data-dh="need" value="${data.district.need ?? 25}"></div>
        <div class="row"><div class="t"><b>${T.dhPen}</b><span>${T.dhUnit}</span></div><input class="num" type="number" step="0.01" data-dh="penalty" value="${data.district.penalty ?? ""}"></div>
        <div class="row"><div class="t"><b>${T.dhBon}</b><span>${T.dhUnit}</span></div><input class="num" type="number" step="0.01" data-dh="bonus" value="${data.district.bonus ?? ""}"></div></div>` : ""}`;
  }
  else body = nowTab(rooms);
  app.innerHTML = tabs + body;
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; location.hash = tab; render(); });
  document.querySelectorAll("[data-room]").forEach((el) => el.onclick = () => openRoom(el.dataset.room));
  document.querySelectorAll("[data-tune]").forEach((b) => b.onclick = async () => { await api("/api/tune", { key: b.dataset.tune, value: Number(b.dataset.v) }); load(); });
  document.querySelectorAll("[data-target]").forEach((b) => b.onclick = async () => { const t = new Set((data.messages || {}).targets || []); t.has(b.dataset.target) ? t.delete(b.dataset.target) : t.add(b.dataset.target); await api("/api/messages", { targets: [...t] }); load(); });
  document.querySelectorAll("[data-mnight]").forEach((b) => b.onclick = async () => { await api("/api/messages", { night: !b.classList.contains("on") }); load(); });
  document.querySelectorAll("[data-mkind]").forEach((b) => b.onclick = async () => { await api("/api/messages", { kind: b.dataset.mkind, on: !b.classList.contains("on") }); load(); });
  document.querySelectorAll("[data-vcool]").forEach((el) => el.onchange = async () => { await api("/api/ventilation", { cooling_entity: el.value || null }); load(); });
  document.querySelectorAll("[data-dh]").forEach((el) => el.onchange = async () => { await api("/api/district", { [el.dataset.dh]: el.value === "" ? null : Number(el.value.replace(",", ".")) }); load(); });
  document.querySelectorAll("[data-feat]").forEach((b) => b.onclick = async () => { await api("/api/feature", { key: b.dataset.feat, on: !b.classList.contains("on") }); load(); });
}
function openRoom(id) {
  const r = data.rooms.find((x) => x.area_id === id), c = r.cfg;
  const seg = (key, opts, cur, labels) => `<div class="seg" data-seg="${key}">${opts.map((o) => `<button data-v="${o}" class="${cur === o ? "on" : ""}">${esc(labels[o])}</button>`).join("")}</div>`;
  const numIn = (key, v) => `<div class="stepper" data-step="${key}" data-val="${v}"><button data-d="-0.5">−</button><b>${num(v)}°</b><button data-d="0.5">+</button></div>`;
  const hourSel = (key, v) => `<select data-k="${key}">${Array.from({ length: 25 }, (_, h) => `<option value="${h}" ${Number(v) === h ? "selected" : ""}>${String(h).padStart(2, "0")}:00</option>`).join("")}</select>`;
  const now = (r.devices || []).map((d) => `${esc(d.name)}: ${d.state === "off" ? T.off : num(d.setpoint) + "°"}`).join("<br>");
  const calls = (r.calls || []).map((x) => `${x.domain}.${x.service} ${JSON.stringify(Object.fromEntries(Object.entries(x.data).filter(([k]) => k !== "entity_id")))}`).join("\n");
  document.getElementById("sheetbox").innerHTML = `<h3>${esc(r.name)}</h3><p class="muted">${T.windows.replace("{n}", r.windows.length)} · ${T.presence.replace("{n}", r.presence.length)} · <span class="${r.same ? "agreeok" : "agreeno"}">${r.same ? T.same : T.diff}</span></p>
    <div class="row"><div class="t"><b>${T.kind}</b></div>${`<select data-k="kind">${Object.keys(T.kinds).map((k) => `<option value="${k}" ${r.kind === k ? "selected" : ""}>${esc(T.kinds[k])}</option>`).join("")}</select>`}</div>
    <div class="row"><div class="t"><b>${T.heat}</b></div>${seg("heating", ["radiator", "floor", "heatpump", "electric"], r.heating, T.heating)}</div>
    <div class="row"><div class="t"><b>${T.sensor}</b><span>${T.sensorH}</span></div><select data-k="temp_sensor"><option value="">${T.none}</option>${(r.temp_options || []).map((e) => `<option value="${esc(e)}" ${r.temp_sensor === e ? "selected" : ""}>${esc(e)}</option>`).join("")}</select></div>
    <div class="row"><div class="t"><b>${T.comfort}</b><span>${T.comfortH}${r.comfort_learned ? " · " + T.learnedC : ""}</span></div>${numIn("comfort", c.comfort)}</div>
    <div class="row"><div class="t"><b>${T.eveningOn}</b><span>${T.eveningH}</span></div><input type="checkbox" data-evon ${c.evening != null ? "checked" : ""}></div>
    <div class="evrow" style="${c.evening != null ? "" : "display:none"}"><div class="row"><div class="t"><b>${T.evening}</b></div>${numIn("evening", c.evening ?? (c.comfort + 1))}</div>
    <div class="row"><div class="t"><b>${T.hours}</b></div><span>${hourSel("evening_from", c.evening_from ?? 15)} – ${hourSel("evening_to", c.evening_to ?? 22)}</span></div></div>
    <div class="row"><div class="t"><b>${T.hours}</b><span>${T.hoursH}</span></div><span>${hourSel("day_from", c.day_from)} – ${hourSel("day_to", c.day_to)}</span></div>
    ${(data.persons || []).length ? `<div class="row"><div class="t"><b>${T.owner}</b><span>${T.ownerH}</span></div><select data-k="owner"><option value="">${T.nobody}</option>${(r.owner || "").includes(",") ? `<option value="${esc(r.owner)}" selected>${esc(r.owner.split(",").map((e) => (data.persons.find((p) => p.entity_id === e) || {}).name || e).join(" & "))}</option>` : ""}${data.persons.map((p) => `<option value="${esc(p.entity_id)}" ${r.owner === p.entity_id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>` : ""}
    <div class="row"><div class="t"><b>${T.fixed}</b><span>${T.fixedH}${r.hours_today ? " · " + T.uses.replace("{h}", ranges(r.hours_today)) : ""}</span></div><input type="checkbox" data-k="fixed_hours" ${r.fixed_hours ? "checked" : ""}></div>
    <div class="row"><div class="t"><b>${T.setback}</b><span>${T.setbackH}</span></div>${numIn("setback", c.setback)}</div>
    <div class="row"><div class="t"><b>${T.night}</b></div>${numIn("night", c.night)}</div>
    ${(data.all_doors || []).length ? `<div class="row" style="flex-direction:column;align-items:stretch"><div class="t"><b>${T.doorsT}</b><span>${T.doorsH}</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${data.all_doors.map((d) => `<button class="chipb ${(r.doors || []).includes(d.entity_id) ? "on" : ""}" data-door="${esc(d.entity_id)}">${esc(d.name)}</button>`).join("")}</div></div>` : ""}
    <div class="row"><div class="t"><b>${T.exclude}</b></div><input type="checkbox" data-k="excluded" ${r.excluded ? "checked" : ""}></div>
    <details><summary>${T.nowSet} / ${T.would}</summary><p class="muted">${now}</p><div class="calls">${esc(calls)}</div></details>
    <button class="btn" id="save">${T.save}</button><button class="btn ghost" id="close">${T.close}</button>`;
  const sheet = document.getElementById("sheet");
  sheet.classList.add("open");
  const vals = {};
  sheet.querySelectorAll("[data-seg] button").forEach((b) => b.onclick = () => { const s = b.parentElement; s.querySelectorAll("button").forEach((x) => x.classList.remove("on")); b.classList.add("on"); vals[s.dataset.seg] = b.dataset.v; });
  sheet.querySelectorAll("[data-door]").forEach((b) => b.onclick = () => {
    b.classList.toggle("on");
    vals.doors_extra = [...sheet.querySelectorAll("[data-door].on")].map((x) => x.dataset.door);
  });
  sheet.querySelectorAll("[data-evon]").forEach((el) => el.onchange = () => {
    sheet.querySelector(".evrow").style.display = el.checked ? "" : "none";
    vals.evening = el.checked ? Number(sheet.querySelector('[data-step="evening"]').dataset.val) : null;
  });
  sheet.querySelectorAll("[data-step]").forEach((st) => st.querySelectorAll("button").forEach((b) => b.onclick = () => {
    const v = Math.max(5, Math.min(30, Number(st.dataset.val) + Number(b.dataset.d)));
    st.dataset.val = v; st.querySelector("b").textContent = num(v) + "°"; vals[st.dataset.step] = v;
  }));
  sheet.querySelectorAll("[data-k]:not([data-evon])").forEach((el) => el.onchange = () => { vals[el.dataset.k] = el.type === "checkbox" ? el.checked : el.type === "number" ? (el.value === "" ? null : Number(el.value.replace(",", "."))) : el.dataset.k === "owner" ? el.value : ["day_from", "day_to", "evening_from", "evening_to"].includes(el.dataset.k) ? Number(el.value) : el.value || null; });
  document.getElementById("close").onclick = () => sheet.classList.remove("open");
  sheet.onclick = (e) => { if (e.target === sheet) sheet.classList.remove("open"); };
  document.getElementById("save").onclick = async () => { await api("/api/room", { area_id: id, ...vals }); sheet.classList.remove("open"); load(); };
}
async function load() { try { data = await api("/api/status"); render(); } catch (e) { /* tries again */ } }
load();
setInterval(() => { if (!document.getElementById("sheet").classList.contains("open")) load(); }, 30000);
</script>
